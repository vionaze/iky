server {
    listen 80;
    listen [::]:80;
    server_name ikymianstudios.si;

    root /var/www/ikymianstudios.si;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^/(docs|deploy)(/|$) {
        return 404;
    }
}
