server {
    server_name ikymianstudios.si;

    root /var/www/ikymianstudios.si;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~ ^/(docs|deploy)(/|$) {
        return 404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ikymianstudios.si/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ikymianstudios.si/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = ikymianstudios.si) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ikymianstudios.si;
    return 404; # managed by Certbot


}