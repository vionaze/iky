<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Portfolio Ikymian Studios sedang disiapkan.">
  <title>Ikymian Studios</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf7f2; color: #252541; }
    main { min-height: 100svh; display: grid; align-content: center; padding: 40px max(24px, calc((100vw - 1000px) / 2)); }
    h1 { margin: 0 0 24px; max-width: 12ch; font-size: clamp(48px, 9vw, 96px); line-height: 1; letter-spacing: -0.055em; font-weight: 600; }
    p { max-width: 42ch; margin: 0 0 32px; color: #606074; font-size: 18px; line-height: 1.6; }
    a { width: fit-content; color: #51439a; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #51439a; outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Ikymian Studios</h1>
    <p>Portfolio sedang disiapkan.<br>Sampai ketemu sebentar lagi.</p>
    <a href="https://ikymianstudios.si/">ikymianstudios.si</a>
  </main>
</body>
</html>
